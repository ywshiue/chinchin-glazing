<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青青土氣｜釉藥管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1814;--ink2:#4a453e;--ink3:#9a9088;
  --paper:#faf8f4;--paper2:#f2ede4;--paper3:#e8e0d0;
  --line:rgba(26,24,20,0.12);--line2:rgba(26,24,20,0.06);
  --clay:#c4784a;--sage:#5a7a5a;--sage-light:#eaf0e8;
  --amber:#b8860b;--amber-light:#fdf6e3;
  --red:#a03030;--red-light:#fceaea;
  --r:8px;--r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5}
.app{max-width:780px;margin:0 auto;padding:1.5rem 1rem 4rem}
.hdr{display:flex;align-items:baseline;gap:16px;margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--line)}
.hdr-t{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.01em}
.hdr-s{font-size:12px;color:var(--ink3);letter-spacing:0.06em;text-transform:uppercase}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block;margin-left:auto;flex-shrink:0}
.sync-dot.saving{background:var(--amber);animation:pulse .8s infinite}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav{display:flex;gap:6px;margin-bottom:1.75rem;flex-wrap:wrap}
.nb{padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink2);font-family:'DM Sans',sans-serif;transition:all .15s}
.nb:hover{border-color:var(--ink3);color:var(--ink)}
.nb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cnt{display:inline-block;background:var(--clay);color:#fff;border-radius:100px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:500}
.tab{display:none}.tab.on{display:block}
.ss{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.sc{background:var(--paper2);border:1px solid var(--line2);border-radius:var(--r2);padding:14px 16px}
.sn{font-family:'DM Mono',monospace;font-size:26px;line-height:1;margin-bottom:4px}
.sl{font-size:11px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin-bottom:10px}
.card{background:#fff;border:1px solid var(--line2);border-radius:var(--r2);padding:16px 18px;margin-bottom:10px}
.csm{padding:12px 16px}
.rid{font-family:'DM Mono',monospace;font-size:10px;background:var(--paper2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--ink3);flex-shrink:0}
.bdg{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:100px;font-weight:500}
.bok{background:var(--sage-light);color:var(--sage)}
.blw{background:var(--amber-light);color:var(--amber)}
.bot{background:var(--red-light);color:var(--red)}
.bne{background:var(--paper2);color:var(--ink3)}
.bar{border-radius:var(--r);padding:11px 14px;margin-bottom:12px;font-size:13px;border:1px solid}
.bok2{background:var(--sage-light);color:var(--sage);border-color:rgba(90,122,90,.2)}
.bwn{background:var(--amber-light);color:var(--amber);border-color:rgba(184,134,11,.2)}
.ber{background:var(--red-light);color:var(--red);border-color:rgba(160,48,48,.2)}
input[type=text],input[type=number],select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink);font-size:14px;font-family:'DM Sans',sans-serif;-webkit-appearance:none;height:42px}
input:focus,select:focus{outline:none;border-color:var(--ink3)}
label{font-size:12px;color:var(--ink3);display:block;margin-bottom:5px}
.fld{margin-bottom:14px}
.btn{padding:9px 18px;border:1px solid var(--line);border-radius:100px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink2);font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.bdk{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bdk:hover{background:var(--ink2)}
.bcl{background:var(--clay);color:#fff;border-color:var(--clay)}
.bcl:hover{opacity:.88}
.bsg{background:var(--sage);color:#fff;border-color:var(--sage)}
.bwarn{color:var(--amber);border-color:rgba(184,134,11,.35)}
.bwarn:hover{background:var(--amber-light)}
.bdan{color:var(--red);border-color:rgba(160,48,48,.3)}
.bdan:hover{background:var(--red-light)}
.bsm{padding:5px 13px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.fe{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.uh{background:var(--paper2);border:1px solid var(--line2);border-radius:var(--r2);padding:18px 20px;margin-bottom:1.25rem}
.ut{display:table;width:calc(100% + 28px);margin:0 -14px;border-collapse:separate;border-spacing:14px 0}
.uc{display:table-cell;vertical-align:top}
.ucg{width:210px}
.gw{display:flex;height:42px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.gw:focus-within{border-color:var(--ink3)}
.gs{width:40px;flex-shrink:0;border:none;background:transparent;cursor:pointer;font-size:18px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.gs:hover{background:var(--paper2);color:var(--ink)}
.gi{border:none!important;border-radius:0!important;height:100%;font-size:20px!important;font-family:'DM Serif Display',serif;text-align:center;flex:1;min-width:0;padding:0!important;background:transparent;color:var(--ink);-webkit-appearance:none}
.gi:focus{outline:none}
.gu{font-size:12px;color:var(--ink3);padding:0 10px 0 2px;display:flex;align-items:center;flex-shrink:0}
.qg{display:flex;gap:6px;margin-top:7px}
.qb{flex:1;padding:5px 0;border:1px solid var(--line);border-radius:100px;background:transparent;cursor:pointer;font-size:12px;color:var(--ink3);font-family:'DM Sans',sans-serif;text-align:center;transition:all .12s}
.qb:hover,.qb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);margin-bottom:5px;border:1px solid transparent;background:var(--paper2);cursor:pointer}
.mr:hover{border-color:var(--line)}
.mr.ck{background:var(--sage-light);border-color:rgba(90,122,90,.2)}
.mr.ins{background:var(--red-light);border-color:rgba(160,48,48,.12)}
.mr.ins.ck{background:var(--amber-light);border-color:rgba(184,134,11,.2)}
.chk{width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.mr.ck .chk{background:var(--sage);border-color:var(--sage)}
.mr.ck .chk::after{content:'✓';font-size:11px;color:#fff;font-weight:700;line-height:1}
.mn{font-size:13px;flex:1}
.mp{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);width:36px;text-align:right}
.mnd{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;width:52px;text-align:right}
.mr.ins .mnd{color:var(--red)}
.pc{background:var(--amber-light);border:1px solid rgba(184,134,11,.25);border-radius:var(--r2);padding:14px 16px;margin-bottom:8px}
.mt{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;background:#fff;color:var(--amber);border:1px solid rgba(184,134,11,.3);margin:2px}
.upc{background:var(--amber-light);border:1px solid rgba(184,134,11,.25);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fb{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ff{padding:5px 14px;border:1px solid var(--line);border-radius:100px;background:transparent;cursor:pointer;font-size:12px;color:var(--ink3);font-family:'DM Sans',sans-serif;transition:all .12s}
.ff:hover{border-color:var(--ink3);color:var(--ink)}
.ff.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ir{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line2);gap:8px}
.ir:last-child{border-bottom:none}
.bt{height:3px;background:var(--paper3);border-radius:2px;margin-top:4px;overflow:hidden;width:70px}
.bf{height:100%;border-radius:2px;background:var(--sage)}
.bf.lw{background:var(--amber)}
.bf.ot{background:var(--red)}
.tp{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11px;cursor:pointer;border:1px solid;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;flex-shrink:0}
.tp.uns{background:var(--paper2);color:var(--ink3);border-color:var(--line)}
.tp.uns:hover{border-color:var(--sage);color:var(--sage)}
.tp.trk{background:var(--sage-light);color:var(--sage);border-color:rgba(90,122,90,.3)}
.tp.trk:hover{background:var(--red-light);color:var(--red);border-color:rgba(160,48,48,.3)}
.tpd{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.ib{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;padding:0;color:var(--ink3)}
.ib:hover{border-color:var(--ink3);background:var(--paper2);color:var(--ink)}
.ib.sg:hover{border-color:var(--sage);background:var(--sage-light);color:var(--sage)}
.ib.dn:hover{border-color:var(--red);background:var(--red-light);color:var(--red)}
.ib svg{width:13px;height:13px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.rc{display:none}
.rl{background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:13px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.rl:hover{border-color:var(--line);background:var(--paper2)}
.rc:hover{border-color:var(--line);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.ri{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.rn{color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}
.pt{height:3px;background:var(--paper2);border-radius:2px;margin-top:2px;overflow:hidden}
.pf{height:100%;background:var(--paper3);border-radius:2px}
.lr{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.lr:last-child{border-bottom:none}
.lt{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ltg{font-size:10px;padding:2px 8px;border-radius:100px;background:var(--paper2);color:var(--ink3);font-family:'DM Mono',monospace}
.ld{font-size:11px;color:var(--ink3);flex-shrink:0;margin-left:12px;font-family:'DM Mono',monospace}
.mb{position:fixed;inset:0;background:rgba(26,24,20,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.md{background:var(--paper);border-radius:var(--r2);padding:24px;width:520px;max-height:88vh;overflow-y:auto;border:1px solid var(--line)}
.mt2{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:600;margin-bottom:1.25rem}
.ingr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.empty{text-align:center;padding:3rem 1rem;color:var(--ink3);font-size:14px}
.loading{text-align:center;padding:4rem 1rem;color:var(--ink3);font-size:15px}

.stab{padding:8px 16px;border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-size:13px;color:var(--ink3);font-family:'DM Sans',sans-serif;transition:all .15s;margin-bottom:-1px}
.stab:hover{color:var(--ink)}
.stab.son{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
/* ── RWD：手機版 ── */
@media(max-width:600px){
  .app{padding:1rem .75rem 5rem}
  .hdr{margin-bottom:1.25rem;padding-bottom:1rem}
  .hdr-t{font-size:20px}
  .hdr-s{font-size:10px}
  .nav{gap:5px;margin-bottom:1.25rem}
  .nb{padding:6px 11px;font-size:12px}
  /* 統計：4欄→2欄 */
  .ss{grid-template-columns:1fr 1fr;gap:8px}
  .sn{font-size:22px}
  /* 配方卡：3欄→1欄 */
  .g3{grid-template-columns:1fr}
  /* 調配頁 use-table：並排→單欄 */
  .ut{display:block;width:100%;margin:0}
  .uc{display:block;width:100%!important;margin-bottom:12px}
  .uc:last-child{margin-bottom:0}
  /* 原料庫存每列 */
  .ir{flex-wrap:wrap;gap:8px;align-items:flex-start}
  .ir>div:first-child{width:100%}
  .ir>div:last-child{width:100%;justify-content:flex-start}
  /* modal 全寬 */
  .mb{padding:16px 12px}
  .md{width:100%;padding:18px 16px}
  /* g2 grid 在窄螢幕也單欄 */
  .g2{grid-template-columns:1fr}
  /* 待補料卡片 */
  .upc{flex-wrap:wrap}
  .upc>button{width:100%;margin-top:4px}
  /* mat row 文字稍縮 */
  .mn{font-size:12px}
  .mnd{width:44px}
  .mp{width:30px}
}
</style>
</head>

document.getElementById('t-inventory').addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');
  if(btn){
    const act=btn.dataset.act,mid=btn.dataset.mid;
    if(act==='tp'){const m=G.S.materials.find(x=>x.id===mid);if(m){m.tracked=!m.tracked;save();}}
    else if(act==='adj')oAdj(mid);
    else if(act==='edit')oEditMat(mid);
    else if(act==='del'){const m=G.S.materials.find(x=>x.id===mid);if(m&&confirm('確定刪除「'+m.name+'」？')){G.S.materials=G.S.materials.filter(x=>x.id!==mid);save();}}
  }
  const ff=e.target.closest('[data-ff]');
  if(ff){G.IF=ff.dataset.ff;rInv();}
});
document.getElementById('t-use').addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');if(!btn)return;
  if(btn.dataset.act==='pgo'){
    const p=G.S.pending.find(x=>x.id===btn.dataset.pid);
    if(p){G.US={rid:p.recipeId,g:p.totalGrams,user:p.user||'',note:p.note||'',ck:{}};rUse();}
  }
});

}

// ── storage ──
function setSyncDot(state){
  const d=document.getElementById('sdot');
  d.className='sync-dot'+(state==='saving'?' saving':state==='err'?' err':'');
  d.title=state==='saving'?'儲存中…':state==='err'?'儲存失敗':'已同步';
}
const LC_KEY='glaze_local_cache';
function lcSave(data){try{localStorage.setItem(LC_KEY,JSON.stringify(data));}catch(e){}}
function lcLoad(){try{const s=localStorage.getItem(LC_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function applyData(data){
  data.materials.forEach(m=>{if(m.tracked===undefined)m.tracked=false;});
  G.S={materials:data.materials,recipes:data.recipes||[],log:data.log||[],pending:data.pending||[]};
}
async function load(){
  // 先讀本地快取，有就立刻顯示（幾乎零延遲）
  const cached=lcLoad();
  if(cached&&cached.materials&&cached.materials.length){
    applyData(cached);
    render();
    setSyncDot('saving');
  }
  // 背景去 Supabase 取最新資料
  try{
    const data=await sbGet();
    if(data&&data.materials&&data.materials.length){
      applyData(data);
      lcSave(data);
    } else {
      G.S.materials=SM.map(m=>({...m}));
      G.S.recipes=SR.map(r=>({id:r.id,name:r.name,kiln:r.k,color:r.c,note:'',ingredients:r.i.map(x=>({materialId:x[0],pct:x[1]}))}));
      await sbSet(G.S);
      lcSave(G.S);
    }
    setSyncDot('ok');
  }catch(e){
    setSyncDot(cached?'ok':'err');
  }
  render();
}
function save(){
  setSyncDot('saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await sbSet(G.S);lcSave(G.S);setSyncDot('ok');}
    catch(e){setSyncDot('err');}
    render();
  },600);
}

function render(){
  rUse();

  // 永遠渲染所有 tab，確保切換過去時資料已就緒
  rDash();
  rInv();
  rRec();
  rHist();
}

function rUse(){
  // sub-tab state stored on G.USE_TAB
  if(!G.USE_TAB)G.USE_TAB='recipe';
  const tab=G.USE_TAB;

    <button class="stab${tab==='base'?' son':''}" id="st-base">基底試釉</button>

        const need=Math.round(g*ing.pct/tot*10)/10;

        if(!ok)hasI=true;
        return{id:ing.materialId,pct:ing.pct,mat,need,ok};
      });
      allCk=bd.every(b=>US.ck[b.id]);
    }
    const canDo=rec&&g>0&&!hasI&&allCk,canPend=!!(rec&&g>0);
    body=`<div class="uh"><div class="ut">

      <span class="rid">${rec.id}</span>

    </div>`:''}
    </div>
    ${rec&&g>0?`
      ${hasI?'<div class="bar ber" style="margin-bottom:10px">部分原料庫存不足</div>':allCk?'<div class="bar bok2" style="margin-bottom:10px">可以調配</div>':''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

function doBaseTest(deduct){
  const TS=G.TS,S=G.S;
  if(!TS||!TS.rows||!TS.rows.length){alert('請先選擇基底配方');return;}
  const validRows=TS.rows.map(row=>({mid:row.mid,g:parseFloat(row.g)>0?parseFloat(row.g):parseFloat(row.base)||0})).filter(r=>r.g>0);
  if(!validRows.length){alert('請填入克數');return;}
  const totalG=Math.round(validRows.reduce((a,r)=>a+r.g,0)*10)/10;
  const bd=validRows.map(r=>{
    if(deduct){const mat=S.materials.find(m=>m.id===r.mid);if(mat&&mat.tracked)mat.qty=Math.round((mat.qty-r.g)*10)/10;}
    return{materialId:r.mid,grams:r.g};
  });
  const recName=TS.name||(TS.baseRid?TS.baseRid+' 試釉':'試釉');
  S.log.unshift({id:'l'+Date.now(),date:new Date().toISOString().slice(0,10),type:'test',recipeId:TS.baseRid||'TEST',recipeName:recName,totalGrams:totalG,breakdown:bd,isTest:true,deducted:deduct});
  G.TS={baseRid:'',scale:100,rows:[],name:''};
  save();toast(deduct?'試釉記錄完成，庫存已扣除':'試釉記錄完成');
}
function doFreeTest(deduct){
  const FR=G.FR,S=G.S;
  if(!FR||!FR.rows)return;
  const validRows=FR.rows.filter(r=>r.mid&&parseFloat(r.g)>0);
  if(!validRows.length){alert('請至少填入一種原料和克數');return;}
  const totalG=Math.round(validRows.reduce((a,r)=>a+parseFloat(r.g),0)*10)/10;
  const bd=validRows.map(r=>{
    const g=parseFloat(r.g);
    if(deduct){const mat=S.materials.find(m=>m.id===r.mid);if(mat&&mat.tracked)mat.qty=Math.round((mat.qty-g)*10)/10;}
    return{materialId:r.mid,grams:g};
  });
  const recName=FR.name||'自由試釉';
  S.log.unshift({id:'l'+Date.now(),date:new Date().toISOString().slice(0,10),type:'test',recipeId:'FREE',recipeName:recName,totalGrams:totalG,note:FR.note||'',breakdown:bd,isTest:true,deducted:deduct});
  G.FR={rows:[{mid:'',g:''}],name:'',note:''};
  save();toast(deduct?'試釉記錄完成，庫存已扣除':'試釉記錄完成');
}
function stepG(d){const v=Math.max(0,(parseFloat(G.US.g)||0)+d);G.US.g=v;const e=document.getElementById('gi');if(e)e.value=v;rUse();}
function doUse(){
  const S=G.S,US=G.US,rec=S.recipes.find(r=>r.id===US.rid),g=parseFloat(US.g)||0;
  if(!rec||g<=0)return;
  const tot=rec.ingredients.reduce((a,i)=>a+i.pct,0);
  const bd=rec.ingredients.map(ing=>{
    const need=Math.round(g*ing.pct/tot*10)/10;
    const mat=S.materials.find(m=>m.id===ing.materialId);
    if(mat&&mat.tracked)mat.qty=Math.round((mat.qty-need)*10)/10;
    return{materialId:ing.materialId,grams:need};
  });
  S.log.unshift({id:'l'+Date.now(),date:new Date().toISOString().slice(0,10),type:'use',recipeId:rec.id,recipeName:rec.name,totalGrams:g,breakdown:bd});
  G.US={rid:'',g:3000,user:'',note:'',ck:{}};save();toast('調配完成');
}
function savePend(){
  const S=G.S,US=G.US,rec=S.recipes.find(r=>r.id===US.rid),g=parseFloat(US.g)||0;
  if(!rec||g<=0)return;
  const tot=rec.ingredients.reduce((a,i)=>a+i.pct,0);
  const missing=rec.ingredients.filter(ing=>{const mat=S.materials.find(m=>m.id===ing.materialId);const need=Math.round(g*ing.pct/tot*10)/10;return mat&&mat.tracked&&mat.qty<need;})
    .map(ing=>{const need=Math.round(g*ing.pct/tot*10)/10;const mat=S.materials.find(m=>m.id===ing.materialId);return{materialId:ing.materialId,need,have:mat?mat.qty:0};});
  S.pending.push({id:'p'+Date.now(),date:new Date().toISOString().slice(0,10),recipeId:rec.id,recipeName:rec.name,totalGrams:g,user:US.user,note:US.note,missing});
  G.US={rid:'',g:3000,user:'',note:'',ck:{}};save();toast('已列入待補料');
}

function calcRows(){
  // 依據基底配方 + scale 計算預設克數
  const TS=G.TS,S=G.S;
  if(TS.mode==='base'&&TS.baseRid){
    const rec=S.recipes.find(r=>r.id===TS.baseRid);
    if(rec){
      const tot=rec.ingredients.reduce((a,i)=>a+i.pct,0);
      return rec.ingredients.map(ing=>({
        mid:ing.materialId,
        base:Math.round(TS.scale*ing.pct/tot*10)/10, // 按比例換算的基準克數
        g:'' // 人員自行填寫實際克數，空白=使用 base
      }));
    }
  }
  return TS.rows.length?TS.rows:[{mid:'',base:0,g:''}];
}

function rRec(){
  const S=G.S,RF=G.RF,RS=G.RS;
  let recs=S.recipes;
  if(RF!=='all')recs=recs.filter(r=>r.kiln===RF);
  if(RS)recs=recs.filter(r=>r.name.includes(RS)||r.id.toLowerCase().includes(RS.toLowerCase()));
  const wrap=document.getElementById('t-recipes');
  wrap.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div class="lbl" style="margin:0">配方 ${S.recipes.length} 支</div>
      <button class="btn bdk bsm" id="arb">+ 新增配方</button>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <div class="fb" style="margin:0;flex:1">
        ${[['all','全部'],['電窯','電窯'],['瓦斯窯','瓦斯窯']].map(([v,l])=>`<button class="ff${RF===v?' on':''}" id="rf-${v}">${l}</button>`).join('')}
      </div>
      <input id="rsch" style="width:180px;flex-shrink:0" placeholder="搜尋 ID 或名稱…" value="${RS}">
    </div>
    <div>
    ${recs.map(r=>{const tot=r.ingredients.reduce((a,i)=>a+i.pct,0);
      return`<div class="rl" id="rc-${r.id}">
        <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
          <div style="width:28px;height:28px;border-radius:50%;background:${r.color};border:2px solid rgba(0,0,0,.08);flex-shrink:0"></div>
          <div style="min-width:0">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="rid">${r.id}</span>
              <span style="font-size:14px;font-weight:500">${r.name}</span>
            </div>
            <div style="font-size:11px;color:var(--ink3);margin-top:2px">${r.kiln} · ${r.ingredients.length} 種原料</div>
          </div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:260px">
          ${r.ingredients.slice(0,6).map(i=>`<span style="font-size:11px;background:var(--paper2);border-radius:4px;padding:2px 7px;font-family:'DM Mono',monospace;color:var(--ink3)">${i.materialId} ${i.pct}%</span>`).join('')}
          ${r.ingredients.length>6?`<span style="font-size:11px;color:var(--ink3)">+${r.ingredients.length-6}</span>`:''}
        </div>
      </div>`;}).join('')}
    </div>${!recs.length?'<div class="empty">無符合條件的配方</div>':''}`;
  const arbBtn=document.getElementById('arb');if(arbBtn)arbBtn.onclick=oAddRec;
  ['all','電窯','瓦斯窯'].forEach(v=>{const b=document.getElementById('rf-'+v);if(b)b.onclick=()=>{G.RF=v;rRec();};});
  const rschEl=document.getElementById('rsch');if(rschEl)rschEl.oninput=function(){G.RS=this.value;rRec();};
  recs.forEach(r=>{const el=document.getElementById('rc-'+r.id);if(el)el.onclick=()=>oRecDet(r.id);});
}

function rHist(){
  const sorted=G.S.log.slice().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('t-history').innerHTML=`
    <div class="lbl">使用記錄 ${sorted.length} 筆</div>
    ${sorted.length?sorted.map(l=>`<div class="card csm"><div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="rid">${l.isTest?'試釉':l.recipeId}</span><span style="font-size:14px;font-weight:500">${l.recipeName}</span><span class="bdg bne">${l.totalGrams}g</span>${l.isTest?`<span class="bdg" style="background:#f0e8ff;color:#6040a0;font-size:10px">${l.deducted?'試釉·扣庫存':'試釉·未扣庫存'}</span>`:''} ${l.user?`<span style="font-size:12px;color:var(--ink3)">${l.user}</span>`:''}</div>
      ${l.note?`<div style="font-size:12px;color:var(--ink3);margin-bottom:5px">${l.note}</div>`:''}
      <div class="lt">${(l.breakdown||[]).map(b=>`<span class="ltg">${b.materialId} ${b.grams}g</span>`).join('')}</div></div>
      <span class="ld">${l.date}</span></div></div>`).join(''):'<div class="empty">尚無記錄</div>'}`;
}

function modal(h){document.getElementById('modal').innerHTML=`<div class="mb" onclick="if(event.target===this)cModal()">${h}</div>`;}
function cModal(){document.getElementById('modal').innerHTML='';}
function oAddMat(){
  modal(`<div class="md"><div class="mt2">新增原料</div>
    <div class="fld"><label>名稱</label><input id="mn"></div>
    <div class="g2"><div class="fld"><label>目前庫存 (g)</label><input id="mq" type="number" value="0"></div><div class="fld"><label>最低警示 (g)</label><input id="mm" type="number" value="200"></div></div>
    <div class="fld"><label>庫存追蹤</label><select id="mtr"><option value="false">未追蹤</option><option value="true">追蹤中</option></select></div>
    <div class="fld"><label>備註</label><input id="mno" placeholder="選填"></div>
    <div class="fe"><button class="btn" id="amc">取消</button><button class="btn bcl" id="ams">儲存</button></div>
  </div>`);
  document.getElementById('amc').onclick=cModal;
  document.getElementById('ams').onclick=()=>sMat(null);
}
function sMat(id){
  const name=document.getElementById('mn').value.trim(),qty=parseFloat(document.getElementById('mq').value)||0,minQty=parseFloat(document.getElementById('mm').value)||0,note=document.getElementById('mno').value.trim(),tracked=document.getElementById('mtr').value==='true';
  if(!name){alert('請輸入名稱');return;}
  if(id){const m=G.S.materials.find(m=>m.id===id);Object.assign(m,{name,qty,minQty,note,tracked});}
  else G.S.materials.push({id:'m'+Date.now(),name,qty,tracked,unit:'g',minQty,note});
  cModal();save();
}
function oEditMat(id){
  const m=G.S.materials.find(m=>m.id===id);
  modal(`<div class="md"><div class="mt2">編輯原料 — ${m.name}</div>
    <div class="fld"><label>名稱</label><input id="mn" value="${m.name}"></div>
    <div class="g2"><div class="fld"><label>庫存 (g)</label><input id="mq" type="number" value="${m.qty}"></div><div class="fld"><label>最低警示 (g)</label><input id="mm" type="number" value="${m.minQty}"></div></div>
    <div class="fld"><label>庫存追蹤</label><select id="mtr"><option value="false"${!m.tracked?' selected':''}>未追蹤</option><option value="true"${m.tracked?' selected':''}>追蹤中</option></select></div>
    <div class="fld"><label>備註</label><input id="mno" value="${m.note||''}"></div>
    <div class="fe"><button class="btn" id="emc">取消</button><button class="btn bcl" id="ems">儲存</button></div>
  </div>`);
  document.getElementById('emc').onclick=cModal;document.getElementById('ems').onclick=()=>sMat(id);
}
function oAdj(mid){
  const m=G.S.materials.find(m=>m.id===mid);
  modal(`<div class="md"><div class="mt2">入庫 — ${m.name}</div>
    <div style="font-size:13px;color:var(--ink3);margin-bottom:12px">目前庫存：${m.qty}g</div>
    <div class="fld"><label>入庫數量 (g)</label><input id="aq" type="number"></div>
    <div class="fld"><label>操作者</label><input id="au" placeholder="你的名字"></div>
    <div class="fld"><label>備註</label><input id="an" placeholder="選填"></div>
    <div class="fe"><button class="btn" id="adjc">取消</button><button class="btn bsg" id="adjs">確認入庫</button></div>
  </div>`);
  document.getElementById('adjc').onclick=cModal;
  document.getElementById('adjs').onclick=()=>{
    const qty=parseFloat(document.getElementById('aq').value)||0;if(qty<=0){alert('請輸入有效數量');return;}
    m.qty=Math.round((m.qty+qty)*10)/10;
    G.S.log.unshift({id:'l'+Date.now(),date:new Date().toISOString().slice(0,10),type:'in',materialId:mid,materialName:m.name,qty,note:document.getElementById('an').value.trim(),user:document.getElementById('au').value.trim(),breakdown:[]});
    cModal();save();
  };
}
function oAddRec(){rRecModal(null);}
function oRecDet(id){rRecModal(G.S.recipes.find(r=>r.id===id));}
function rRecModal(r){
  const isE=!!r;const ings=r?r.ingredients:[{materialId:'',pct:0}];window._ic=ings.length;
  const mats=G.S.materials;
  const rows=ings.map((ing,i)=>`<div class="ingr" id="ir-${i}">
    <select id="im-${i}" style="flex:2">${mats.map(m=>`<option value="${m.id}"${m.id===ing.materialId?' selected':''}>${m.name}</option>`).join('')}</select>
    <input id="ip-${i}" type="number" placeholder="%" value="${ing.pct||''}" style="width:80px!important">
    <span style="font-size:12px;color:var(--ink3)">%</span>
    <button class="btn bsm bdan" id="rmi-${i}">✕</button>
  </div>`).join('');
  modal(`<div class="md"><div class="mt2">${isE?'編輯配方':'新增配方'}</div>
    <div class="g2"><div class="fld"><label>配方 ID</label><input id="ri" value="${r?r.id:''}" placeholder="例：X0Y16"${isE?' readonly style="opacity:.5"':''}></div><div class="fld"><label>配方名稱</label><input id="rn" value="${r?r.name:''}"></div></div>
    <div class="g2"><div class="fld"><label>窯爐</label><select id="rk"><option${(!r||r.kiln==='電窯')?' selected':''}>電窯</option><option${r&&r.kiln==='瓦斯窯'?' selected':''}>瓦斯窯</option></select></div><div class="fld"><label>顏色</label><input id="rc" type="color" value="${r?r.color:'#ccbbaa'}" style="height:42px;padding:2px"></div></div>
    <div class="fld"><label>備註</label><input id="rno" value="${r?r.note:''}"></div>
    <div style="font-size:12px;font-weight:500;margin:10px 0 8px;color:var(--ink2)">原料組成（百分比）</div>
    <div id="il">${rows}</div>
    <button class="btn bsm" id="aib" style="margin-bottom:14px">+ 新增原料</button>
    <div class="fe"><button class="btn" id="rcc">取消</button>${isE?`<button class="btn bdan" id="rcd">刪除</button>`:''}
    <button class="btn bcl" id="rcs">${isE?'儲存':'新增'}</button></div>
  </div>`);
  ings.forEach((_,i)=>{document.getElementById('rmi-'+i).onclick=()=>rmIng(i);});
  document.getElementById('aib').onclick=addIng;
  document.getElementById('rcc').onclick=cModal;
  if(isE)document.getElementById('rcd').onclick=()=>{if(!confirm('確定刪除此配方？'))return;G.S.recipes=G.S.recipes.filter(x=>x.id!==r.id);cModal();save();};
  document.getElementById('rcs').onclick=()=>sRec(isE?r.id:null);
}
function addIng(){
  const i=window._ic++;const div=document.createElement('div');div.className='ingr';div.id=`ir-${i}`;
  div.innerHTML=`<select id="im-${i}" style="flex:2">${G.S.materials.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select>
    <input id="ip-${i}" type="number" placeholder="%" style="width:80px!important">
    <span style="font-size:12px;color:var(--ink3)">%</span>
    <button class="btn bsm bdan" id="rmi-${i}">✕</button>`;
  document.getElementById('il').appendChild(div);
  document.getElementById('rmi-'+i).onclick=()=>rmIng(i);
}
function rmIng(i){const el=document.getElementById('ir-'+i);if(el)el.remove();}
function sRec(id){
  const rid=id||document.getElementById('ri').value.trim(),name=document.getElementById('rn').value.trim();
  if(!rid||!name){alert('請填入 ID 與名稱');return;}
  const ings=[];
  for(let i=0;i<window._ic;i++){const me=document.getElementById('im-'+i),pe=document.getElementById('ip-'+i);if(!me)continue;const pct=parseFloat(pe.value)||0;if(pct>0)ings.push({materialId:me.value,pct});}
  if(!ings.length){alert('請至少新增一種原料');return;}
  const data={name,color:document.getElementById('rc').value,kiln:document.getElementById('rk').value,note:document.getElementById('rno').value.trim(),ingredients:ings};
  if(id){Object.assign(G.S.recipes.find(x=>x.id===id),data);}
  else{if(G.S.recipes.find(x=>x.id===rid)){alert('此 ID 已存在');return;}G.S.recipes.push({id:rid,...data});}
  cModal();save();
}
function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 22px;border-radius:100px;font-size:13px;z-index:999;opacity:1;transition:opacity .35s;font-family:"DM Sans",sans-serif;white-space:nowrap';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),380)},2400);
}
load();
</script>
</body>
</html>
